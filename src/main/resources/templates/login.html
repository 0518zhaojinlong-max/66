<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>登录</h1>

    <div class="alert alert-success" th:if="${registered}">注册成功，请登录。</div>
    <div class="alert alert-success" th:if="${param.logout}">您已退出登录。</div>
    <div class="alert alert-error" th:if="${param.error}">用户名或密码错误。</div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" type="text" name="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit">登录</button>
    </form>

    <div class="footer">还没有账号？<a th:href="@{/register}">立即注册</a></div>
</div>
</body>
</html>
